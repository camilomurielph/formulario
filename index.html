<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>actols · Encuesta para emprendedores</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Fuente Inter (igual que la página de referencia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- ========== ENCABEZADO CON LOGO ========== -->
        <header>
            <div class="brand-header">
                <a href="#" class="logo" aria-label="actols inicio">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#0B4F5C" width="32" height="32">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span>actols</span>
                </a>
            </div>
            <div class="survey-title">
                <h1>¿En qué gasta más tiempo tu empresa?</h1>
                <p>Encuesta confidencial para emprendedores e independientes</p>
            </div>
        </header>

        <!-- ========== CONTENIDO DEL FORMULARIO (sin cambios) ========== -->
        <main>
            <!-- Barra de progreso -->
            <div id="progress-bar" class="form-mode">
                <div id="progress-fill"></div>
            </div>
            <div id="step-indicator" class="form-mode">Pregunta 1 de 10</div>

            <div id="question-container" class="form-mode"></div>

            <div id="navigation" class="form-mode">
                <button id="prev-btn" class="nav-btn" disabled>⬅ Anterior</button>
                <button id="next-btn" class="nav-btn">Siguiente ➡</button>
            </div>

            <div id="submit-section" class="form-mode" style="display: none;">
                <button id="submit-btn">📤 Enviar respuestas</button>
            </div>

            <!-- ===== PANEL ADMIN ===== -->
            <div id="admin-panel" style="display: none;">
                <div id="admin-actions">
                    <button id="view-responses-btn" class="admin-btn">📋 Ver respuestas</button>
                    <button id="download-excel-btn" class="admin-btn">📥 Descargar Excel</button>
                    <button id="manage-responses-btn" class="admin-btn">🗂️ Administrar respuestas</button>
                    <button id="logout-btn" class="admin-btn logout">🚪 Cerrar sesión</button>
                </div>
                <div id="admin-content"></div>
            </div>

            <!-- Botón de acceso a admin -->
            <div id="admin-trigger">
                <button id="admin-login-btn">🔐 Admin</button>
            </div>
        </main>

        <!-- Toast -->
        <div id="toast"></div>
    </div>

    <!-- Modal -->
    <div id="response-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Detalles de la respuesta</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Librerías para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Datos del cuestionario -->
    <script src="questions.js"></script>
    <!-- Lógica principal -->
    <script src="app.js"></script>
</body>
</html>
